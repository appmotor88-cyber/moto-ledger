<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Motorcycle Bookkeeping</title>
<style>
:root{
  --bg:#f5f5f4; --card:#fff; --text:#1c1917; --muted:#78716c;
  --border:#e7e5e4; --accent:#0f766e; --accent2:#0d9488;
  --profit:#15803d; --loss:#b91c1c;
  --shadow:0 4px 14px rgba(28,25,23,.08); --shadow-lg:0 10px 30px rgba(28,25,23,.14);
  --radius:16px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121110; --card:#1e1c1a; --text:#f5f5f4; --muted:#a39d97;
    --border:#332f2c; --accent:#f59e0b; --accent2:#fb923c; --profit:#4ade80; --loss:#f87171;
    --shadow:0 4px 16px rgba(0,0,0,.35); --shadow-lg:0 12px 32px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#121110; --card:#1e1c1a; --text:#f5f5f4; --muted:#a39d97;
  --border:#332f2c; --accent:#f59e0b; --accent2:#fb923c; --profit:#4ade80; --loss:#f87171;
  --shadow:0 4px 16px rgba(0,0,0,.35); --shadow-lg:0 12px 32px rgba(0,0,0,.5);
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
*{box-sizing:border-box;}
body{margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:16px; padding-bottom:calc(16px + env(safe-area-inset-bottom,0px)); -webkit-font-smoothing:antialiased; position:relative;}
.bg-moto{position:fixed; inset:0; z-index:-1; pointer-events:none; overflow:hidden; background:var(--bg);}
.bg-moto svg{position:absolute; bottom:-4%; right:-8%; width:130%; max-width:900px; opacity:.06; color:var(--accent);}
:root[data-theme="dark"] .bg-moto svg{opacity:.09;}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .bg-moto svg{opacity:.09;} }
h1{font-size:1.25rem; margin:0 0 12px; display:flex; align-items:center; gap:8px; letter-spacing:.2px;}
.summary{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;}
.stat{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 14px; box-shadow:var(--shadow);}
.stat .n{font-size:1.35rem; font-weight:800; color:var(--accent);}
.stat .l{font-size:.75rem; color:var(--muted); margin-top:2px;}
button{font-family:inherit; cursor:pointer; border:none; border-radius:10px; padding:10px 14px; font-size:.9rem; transition:transform .12s ease, opacity .12s ease;}
button:active{transform:scale(.97);}
.row2{display:flex; gap:8px; margin-bottom:10px;}
.row2 button{flex:1; background:var(--card); border:1px solid var(--border); color:var(--text); font-size:.8rem; box-shadow:var(--shadow);}
.btn-main{background:linear-gradient(135deg, var(--accent), var(--accent2)); color:#1c1917; width:100%; margin-bottom:10px; font-weight:700; box-shadow:var(--shadow-lg); padding:13px 14px; font-size:.95rem;}
.search-row{display:flex; gap:8px; margin-bottom:10px;}
.search-row input, .search-row select{flex:1; padding:10px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:.85rem; font-family:inherit; box-shadow:var(--shadow);}
.card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:12px; box-shadow:var(--shadow); transition:box-shadow .15s ease;}
.card-top{display:flex; justify-content:space-between; align-items:center;}
.card-top-left{display:flex; align-items:center; gap:10px;}
.thumb{width:52px; height:52px; border-radius:12px; object-fit:cover; background:var(--border); flex-shrink:0; box-shadow:var(--shadow);}
.card-title{font-weight:700; font-size:1rem;}
.card-sub{font-size:.8rem; color:var(--muted); margin-top:2px;}
.badge{font-size:.68rem; padding:4px 10px; border-radius:99px; background:var(--border); font-weight:600; letter-spacing:.2px;}
.badge.sold{background:linear-gradient(135deg, var(--accent), var(--accent2)); color:#1c1917;}
.card-body{margin-top:8px; font-size:.85rem; display:grid; grid-template-columns:1fr 1fr; gap:4px 10px;}
.card-body div span{color:var(--muted);}
.exp-line{font-size:.8rem; color:var(--muted); margin-top:2px;}
.notes-line{font-size:.8rem; margin-top:6px; font-style:italic; color:var(--muted);}
.profit-line{margin-top:8px; font-weight:700; font-size:.95rem;}
.profit-line.p{color:var(--profit);} .profit-line.l{color:var(--loss);}
.actions{display:flex; gap:8px; margin-top:10px;}
.actions button{flex:1; background:var(--border); color:var(--text); font-size:.8rem;}
.actions button.del{background:transparent; color:var(--loss); border:1px solid var(--loss);}
.empty{text-align:center; color:var(--muted); padding:30px 10px; font-size:.9rem;}
.tabs{display:flex; gap:8px; margin-bottom:12px;}
.tab-btn{flex:1; background:var(--card); border:1px solid var(--border); color:var(--muted); font-weight:600; padding:10px; box-shadow:var(--shadow);}
.tab-btn.active{background:linear-gradient(135deg, var(--accent), var(--accent2)); color:#1c1917; border-color:transparent; box-shadow:var(--shadow-lg);}
.overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(2px); display:none; align-items:flex-end; justify-content:center; z-index:10;}
.overlay.open{display:flex;}
.sheet{background:var(--card); width:100%; max-width:480px; border-radius:22px 22px 0 0; padding:18px; padding-bottom:calc(18px + env(safe-area-inset-bottom,0px)); max-height:88vh; overflow-y:auto; box-shadow:var(--shadow-lg); border-top:1px solid var(--border);}
.sheet h2{margin:0 0 12px; font-size:1.1rem; display:flex; align-items:center; gap:8px;}
label{display:block; font-size:.8rem; color:var(--muted); margin:10px 0 4px; font-weight:600;}
input, textarea, select{width:100%; padding:11px; border-radius:10px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:.9rem; font-family:inherit; transition:border-color .12s ease;}
input:focus, textarea:focus, select:focus{outline:none; border-color:var(--accent);}
textarea{resize:vertical; min-height:60px;}
.sold-toggle{display:flex; align-items:center; gap:8px; margin-top:14px; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:10px;}
.sold-toggle input{width:auto;}
.sold-toggle label{margin:0; color:var(--text); font-weight:600; font-size:.85rem;}
#soldFields{display:none;} #soldFields.show{display:block;}
.sheet-actions{display:flex; gap:8px; margin-top:16px;}
.sheet-actions button{flex:1;}
.save{background:linear-gradient(135deg, var(--accent), var(--accent2)); color:#1c1917; font-weight:700; box-shadow:var(--shadow-lg);}
.cancel{background:var(--border); color:var(--text);}
.exp-row{display:flex; gap:6px; margin-top:6px; align-items:center;}
.exp-row input{flex:1;}
.exp-row .rm{background:transparent; color:var(--loss); border:1px solid var(--loss); padding:8px 10px; flex:0 0 auto;}
.add-exp{background:var(--border); color:var(--text); width:100%; margin-top:8px; font-size:.8rem;}
.chart-wrap{display:none; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:12px; box-shadow:var(--shadow);}
.chart-wrap.show{display:block;}
.chart-row{display:flex; align-items:center; gap:8px; margin-top:6px; font-size:.78rem;}
.chart-label{width:64px; color:var(--muted); flex-shrink:0;}
.chart-bar-bg{flex:1; background:var(--border); border-radius:6px; overflow:hidden; height:16px;}
.chart-bar{height:100%; background:var(--accent2);}
.chart-bar.neg{background:var(--loss);}
.chart-val{width:80px; text-align:right; flex-shrink:0;}
</style>
</head>
<body>

<div class="bg-moto" aria-hidden="true">
<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="165" cy="300" r="88" stroke-width="12"/>
  <circle cx="165" cy="300" r="34" stroke-width="8"/>
  <circle cx="620" cy="300" r="88" stroke-width="12"/>
  <circle cx="620" cy="300" r="34" stroke-width="8"/>
  <path d="M165 300 L340 300 L430 180 L520 180"/>
  <path d="M340 300 L400 190"/>
  <path d="M430 180 L470 130 L520 130"/>
  <path d="M520 130 L500 110 M520 130 L545 105"/>
  <path d="M400 190 L460 300 L620 300"/>
  <path d="M400 190 L330 235 L250 235 L200 260"/>
  <path d="M330 190 Q400 155 470 190 L470 230 Q400 210 330 230 Z" fill="currentColor" stroke="none" opacity=".85"/>
  <path d="M600 250 L680 270 L680 290 L610 285 Z" fill="currentColor" stroke="none" opacity=".85"/>
</svg>
</div>

<div id="debugBanner" style="display:none; position:fixed; top:0; left:0; right:0; z-index:999; background:#b91c1c; color:#fff; padding:12px; font-size:.8rem; word-break:break-word;"></div>
<script>
window.onerror = function(msg, src, line){
  const b = document.getElementById("debugBanner");
  b.style.display = "block";
  b.textContent = "Error: " + msg + " (line " + line + ")";
  return false;
};
</script>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<div class="overlay open" id="authOverlay" style="background:var(--bg); position:fixed; align-items:center;">
  <div class="sheet" style="max-width:380px; border-radius:20px; box-shadow:var(--shadow-lg); border:1px solid var(--border);">
    <h2 id="authTitle">🏍️ Login</h2>
    <div id="authError" style="display:none; background:color-mix(in srgb, var(--loss) 15%, transparent); color:var(--loss); padding:9px 11px; border-radius:8px; font-size:.8rem; margin-bottom:8px; border:1px solid color-mix(in srgb, var(--loss) 35%, transparent);"></div>
    <label>Email</label>
    <input id="authEmail" type="email" autocomplete="email">
    <label>Password</label>
    <input id="authPassword" type="password" autocomplete="current-password">
    <div id="authCodeWrap" style="display:none;">
      <label>Activation Code</label>
      <input id="authCode" autocomplete="off">
    </div>
    <div class="sheet-actions">
      <button class="save" id="authSubmitBtn" onclick="authSubmit()" style="width:100%;">Login</button>
    </div>
    <div style="text-align:center; margin-top:10px; font-size:.85rem;">
      <a href="#" id="authToggleLink" onclick="authToggleMode();return false;" style="color:var(--accent);">Don't have an account? Sign up</a>
    </div>
  </div>
</div>

<div id="appRoot" style="display:none;">
<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
  <h1 style="margin-bottom:0;">🏍️ Motorcycle Bookkeeping</h1>
  <button onclick="doLogout()" style="background:var(--border); color:var(--text); font-size:.75rem; padding:7px 12px; box-shadow:var(--shadow);">Logout</button>
</div>

<div class="card" id="adminPanel" style="display:none;">
  <div style="font-weight:700; margin-bottom:8px;">🔑 Admin: Activation Codes</div>
  <button onclick="generateCode()" style="background:var(--accent); color:#fff; width:100%; margin-bottom:8px;">+ Generate New Code</button>
  <div id="newCodeBox" style="display:none; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:10px; margin-bottom:8px; text-align:center;">
    <div style="font-size:1.1rem; font-weight:700; letter-spacing:1px;" id="newCodeText"></div>
    <button onclick="copyNewCode()" style="margin-top:6px; background:var(--border); color:var(--text); font-size:.75rem;">Copy</button>
  </div>
  <div id="codesList" style="font-size:.8rem;"></div>
</div>

<div class="summary">
  <div class="stat"><div class="n" id="statProfit">0</div><div class="l">Total Profit / Loss (IDR)</div></div>
  <div class="stat"><div class="n" id="statCount">0</div><div class="l">Total Motorcycles</div></div>
</div>

<button class="btn-main" onclick="openForm()">+ Add New Motorcycle</button>

<div class="row2">
  <button onclick="toggleChart()">📊 Monthly Chart</button>
  <button onclick="exportData()">⬆️ Export</button>
  <button onclick="document.getElementById('importInput').click()">⬇️ Import</button>
</div>
<input id="importInput" type="file" accept="application/json" style="display:none;" onchange="importData(event)">

<div class="chart-wrap" id="chartWrap"></div>

<div class="search-row">
  <input id="searchBox" placeholder="🔍 Search plate or model" oninput="render()">
  <select id="sortBox" onchange="render()">
    <option value="newest">Newest</option>
    <option value="buyDate">Purchase Date</option>
    <option value="sellDate">Sale Date</option>
    <option value="profitDesc">Profit (high→low)</option>
    <option value="profitAsc">Profit (low→high)</option>
  </select>
</div>

<div class="tabs">
  <button class="tab-btn" id="tabUnsold" onclick="setTab('unsold')">Unsold (<span id="countUnsold">0</span>)</button>
  <button class="tab-btn" id="tabSold" onclick="setTab('sold')">Sold (<span id="countSold">0</span>)</button>
</div>

<div id="list"></div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h2 id="formTitle">Add New Motorcycle</h2>
    <input type="hidden" id="editId">

    <label>Plate Number</label>
    <input id="plate" placeholder="e.g. B 1234 XYZ" autocomplete="off">

    <label>Motorcycle Type / Model</label>
    <input id="model" placeholder="e.g. Honda Beat" autocomplete="off">

    <label>Photo</label>
    <div style="display:flex; gap:8px;">
      <div style="position:relative; flex:1; border-radius:10px; overflow:hidden;">
        <div style="background:var(--border); color:var(--text); border-radius:10px; padding:10px 14px; font-size:.9rem; text-align:center;">📷 Camera</div>
        <input id="cameraInput" type="file" accept="image/*" capture="environment" style="position:absolute; inset:0; width:100%; height:100%; opacity:0;" onchange="handlePhoto(event)">
      </div>
      <div style="position:relative; flex:1; border-radius:10px; overflow:hidden;">
        <div style="background:var(--border); color:var(--text); border-radius:10px; padding:10px 14px; font-size:.9rem; text-align:center;">🖼️ Gallery</div>
        <input id="galleryInput" type="file" accept="image/*" style="position:absolute; inset:0; width:100%; height:100%; opacity:0;" onchange="handlePhoto(event)">
      </div>
    </div>
    <img id="photoPreview" style="display:none; width:100%; max-height:160px; object-fit:cover; border-radius:10px; margin-top:8px;">

    <label>Purchased From (optional)</label>
    <input id="fromWhom" placeholder="Seller name" autocomplete="off">

    <label>Purchase Date</label>
    <input id="buyDate" type="date">

    <label>Purchase Price (IDR)</label>
    <input id="buyPrice" type="text" inputmode="numeric" autocomplete="off" oninput="formatNumberInput(event)">

    <label>Other Expenses</label>
    <div id="expList"></div>
    <button type="button" class="add-exp" onclick="addExpenseRow()">+ Add Expense</button>

    <label>Notes</label>
    <textarea id="notes" placeholder="Any notes about this motorcycle..."></textarea>

    <div class="sold-toggle">
      <input type="checkbox" id="soldCheck" onchange="toggleSoldFields()">
      <label for="soldCheck">This motorcycle has been sold</label>
    </div>

    <div id="soldFields">
      <label>Buyer Name (optional)</label>
      <input id="toWhom" placeholder="Buyer name" autocomplete="off">
      <label>Sale Date</label>
      <input id="sellDate" type="date">
      <label>Sale Price (IDR)</label>
      <input id="sellPrice" type="text" inputmode="numeric" autocomplete="off" oninput="formatNumberInput(event)">
    </div>

    <div class="sheet-actions">
      <button class="cancel" onclick="closeForm()">Cancel</button>
      <button class="save" onclick="saveItem()">Save</button>
    </div>
  </div>
</div>
</div><!-- /appRoot -->

<script>
const firebaseConfig = {
  apiKey: "AIzaSyADSTyXZJHZbbExG415iGpV3CFld0hKFY0",
  authDomain: "moto-ledger.firebaseapp.com",
  projectId: "moto-ledger",
  storageBucket: "moto-ledger.firebasestorage.app",
  messagingSenderId: "858295382904",
  appId: "1:858295382904:web:2105a9588575fa65e80e8d"
};
let auth, db;
try{
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db = firebase.firestore();
} catch(err){
  const b = document.getElementById("debugBanner");
  b.style.display = "block";
  b.textContent = "Firebase init failed: " + err.message;
}

let currentUser = null;
let motorsCollection = null;
let unsubscribeMotors = null;
let authMode = "login"; // or "signup"

const ADMIN_EMAIL = "appmotor88@gmail.com";

function generateRandomCode(){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // no O/0/I/1 to avoid confusion
  let code = "";
  for(let i=0;i<8;i++) code += chars[Math.floor(Math.random()*chars.length)];
  return code;
}

async function generateCode(){
  const code = generateRandomCode();
  try{
    await db.collection("activationCodes").doc(code).set({
      used: false,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    document.getElementById("newCodeText").textContent = code;
    document.getElementById("newCodeBox").style.display = "block";
    loadCodesList();
  } catch(err){
    alert("Failed to generate code: " + err.message);
  }
}

function copyNewCode(){
  const text = document.getElementById("newCodeText").textContent;
  navigator.clipboard.writeText(text).then(()=> alert("Copied: " + text));
}

async function loadCodesList(){
  const box = document.getElementById("codesList");
  box.innerHTML = "Loading...";
  try{
    const snap = await db.collection("activationCodes").orderBy("createdAt","desc").limit(20).get();
    if(snap.empty){ box.innerHTML = '<div style="color:var(--muted);">No codes yet.</div>'; return; }
    box.innerHTML = snap.docs.map(d=>{
      const v = d.data();
      const status = v.used ? `used by ${v.usedByEmail||'?'}` : "unused";
      return `<div style="display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid var(--border);">
        <span>${d.id}</span><span style="color:${v.used?'var(--muted)':'var(--profit)'}">${status}</span>
      </div>`;
    }).join("");
  } catch(err){
    box.innerHTML = '<div style="color:var(--loss);">Failed to load codes.</div>';
  }
}

function authToggleMode(){
  authMode = authMode === "login" ? "signup" : "login";
  document.getElementById("authTitle").textContent = authMode === "login" ? "🏍️ Login" : "🏍️ Sign Up";
  document.getElementById("authSubmitBtn").textContent = authMode === "login" ? "Login" : "Sign Up";
  document.getElementById("authCodeWrap").style.display = authMode === "signup" ? "block" : "none";
  document.getElementById("authToggleLink").textContent = authMode === "login" ? "Don't have an account? Sign up" : "Already have an account? Login";
  document.getElementById("authError").style.display = "none";
}

function showAuthError(msg){
  const el = document.getElementById("authError");
  el.textContent = msg;
  el.style.display = "block";
}

async function authSubmit(){
  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value;
  const code = document.getElementById("authCode").value.trim();
  document.getElementById("authError").style.display = "none";
  if(!email || !password){ showAuthError("Please enter email and password."); return; }
  const btn = document.getElementById("authSubmitBtn");
  btn.disabled = true;
  try{
    if(authMode === "login"){
      await auth.signInWithEmailAndPassword(email, password);
    } else {
      if(!code){ showAuthError("Please enter your activation code."); btn.disabled=false; return; }
      let cred;
      try{
        cred = await auth.createUserWithEmailAndPassword(email, password);
      } catch(err){
        showAuthError(err.message || "Could not create account.");
        btn.disabled = false;
        return;
